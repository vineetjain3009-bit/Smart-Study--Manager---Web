{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Smart Study Manager</h1>

        <p>Login to manage your semester</p>

        <form method="POST">

            <label>Username</label>
            <input type="text"
                   name="username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create account
            </a>
        </p>

    </div>

</div>

{% endblock %}
